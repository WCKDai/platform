# Coolify deployment: Invincible (cloud models through LiteLLM), Autobot and the panel.
#
# The images are loaded from the public, signed release tarballs by
# scripts/load-alpha-images.sh. They are tagged wckd-agent-stack/*:<version> and pull_policy is
# never, so neither Coolify nor Docker contacts a registry: the private GHCR packages are not used
# and no registry credential is needed. The Coolify app's custom build command is a no-op (the
# deploy workflow sets it) so Coolify's pre-deploy image pull is skipped too.
# Coolify's Traefik terminates TLS; there is no Caddy here. The panel is the public one.
#
# Invincible and Autobot only listen on loopback by design (paired devices reach the agent
# through the gateway). Container-to-container DNS would therefore never work, so the agent and
# panel share the gateway container's network namespace. Only the gateway has a network; the
# panel listens on 0.0.0.0:7800 there, and Coolify's domain for this application points at the
# gateway service on port 7800.
#
# Coolify magic variables (generated, visible in the application's Environment tab):
#   SERVICE_PASSWORD_64_INVINCIBLE  gateway token, also written to the shared volume
#   SERVICE_PASSWORD_64_PANEL       panel login password
#   SERVICE_PASSWORD_64_SECRET      session signing secret
#
# Set CLOUD_BASE_URL, CLOUD_MODEL and CLOUD_API_KEY in the Coolify application.
name: wckd-agent-coolify

services:
  gateway:
    image: ${GATEWAY_IMAGE:-wckd-agent-stack/wckd-invincible-gateway:v0.0.28}
    pull_policy: never
    restart: unless-stopped
    environment:
      INVINCIBLE_HOME: /data
      INVINCIBLE_TOKEN: ${SERVICE_PASSWORD_64_INVINCIBLE}
      CLOUD_BASE_URL: ${CLOUD_BASE_URL:?set in Coolify}
      CLOUD_MODEL: ${CLOUD_MODEL:?set in Coolify}
      CLOUD_API_KEY: ${CLOUD_API_KEY:?set in Coolify}
      CLOUD_CONTEXT: ${CLOUD_CONTEXT:-65536}
    volumes:
      - gateway-data:/data
    expose:
      - "7800"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7777/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  agent:
    image: ${AUTOBOT_IMAGE:-wckd-agent-stack/wckd-autobot:v0.0.28}
    pull_policy: never
    restart: unless-stopped
    network_mode: "service:gateway"
    environment:
      AUTOBOT_HOME: /data
      INVINCIBLE_HOME: /invincible
      GATEWAY_URL: http://127.0.0.1:7777/v1
      GATEWAY_MODEL: auto
      GATEWAY_PRIVATE: "false"
      APPROVALS_MODE: auto
      AGENT_WORKDIR: /workspace
      GH_TOKEN: ${GH_TOKEN:-}
      GIT_SSH_KEY_B64: ${GIT_SSH_KEY_B64:-}
    volumes:
      - agent-data:/data
      - gateway-data:/invincible:ro
      - workspace:/workspace
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7792/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  panel:
    image: ${PANEL_IMAGE:-wckd-agent-stack/wckd-agent-panel:v0.0.28}
    pull_policy: never
    restart: unless-stopped
    network_mode: "service:gateway"
    environment:
      PORT: "7800"
      PANEL_BIND: 0.0.0.0
      GATEWAY_URL: http://127.0.0.1:7777/v1
      AGENT_URL: http://127.0.0.1:7792
      INVINCIBLE_TOKEN: ${SERVICE_PASSWORD_64_INVINCIBLE}
      PANEL_PASSWORD: ${SERVICE_PASSWORD_64_PANEL}
      PANEL_SECRET: ${SERVICE_PASSWORD_64_SECRET}
      PANEL_SECURE_COOKIES: "true"
    depends_on:
      agent:
        condition: service_healthy

volumes:
  gateway-data:
  agent-data:
  workspace:
