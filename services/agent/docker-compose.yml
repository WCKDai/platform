# WCKD agent stack: Autobot + the authenticated control panel, behind Caddy.
#
# Invincible stays the gateway: run it on this host and keep it out of this compose file, so the
# agent can be redeployed without moving a 15 GB model or restarting the thing that serves every
# other model call.
#
# Invincible and Autobot only listen on loopback by design (paired devices reach the agent
# through the gateway). The agent, panel and Caddy therefore use host networking, which puts them
# in the host's loopback namespace next to Invincible. This requires a Linux Docker host; Docker
# Desktop on macOS keeps containers in a VM and cannot see the host's 127.0.0.1.
#
#   cp .env.example .env
#   panel/scripts/hash-password.mjs '...'   # put in PANEL_PASSWORD_HASH
#   scripts/fetch-linux-binaries.sh v0.0.23
#   docker compose up -d --build
#
name: wckd-agent

services:
  agent:
    image: ${AUTOBOT_IMAGE:-wckd/autobot:local}
    build:
      context: ./images/autobot
    restart: unless-stopped
    network_mode: host
    environment:
      AUTOBOT_HOME: /data
      INVINCIBLE_HOME: /invincible
      GATEWAY_URL: ${GATEWAY_URL:-http://127.0.0.1:7777/v1}
      APPROVALS_MODE: ${APPROVALS_MODE:-auto}
      AGENT_WORKDIR: /workspace
      GH_TOKEN: ${GH_TOKEN:-}
    volumes:
      - agent-data:/data
      - ${INVINCIBLE_DATA:-./data/invincible}:/invincible:ro
      - ${WORKSPACE:-./workspace}:/workspace
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  panel:
    image: ${PANEL_IMAGE:-wckd/agent-panel:local}
    build:
      context: ./panel
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: "7800"
      PANEL_BIND: 127.0.0.1
      GATEWAY_URL: ${GATEWAY_URL:-http://127.0.0.1:7777/v1}
      AGENT_URL: ${AGENT_URL:-http://127.0.0.1:7792}
      INVINCIBLE_TOKEN: ${INVINCIBLE_TOKEN:?set INVINCIBLE_TOKEN}
      PANEL_PASSWORD_HASH: ${PANEL_PASSWORD_HASH:?set PANEL_PASSWORD_HASH}
      PANEL_SECRET: ${PANEL_SECRET:?set PANEL_SECRET}
      PANEL_SECURE_COOKIES: ${PANEL_SECURE_COOKIES:-true}
    depends_on:
      agent:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    network_mode: host
    depends_on:
      - panel
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN:?set PANEL_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  agent-data:
  caddy-data:
  caddy-config:
