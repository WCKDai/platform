name: Deploy LiteLLM

# Creates (or reuses) the LiteLLM docker-compose application in the PolyCore Coolify project,
# writes its environment from the `infra` environment, then deploys and waits for it to be
# healthy.
#
# One job on purpose: a GitHub Actions job can read exactly one environment. LiteLLM needs the
# Coolify token and the provider keys, so both live in `infra`. Provider keys are only used to
# write the application environment; nothing echoes them.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-litellm
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy LiteLLM
    runs-on: ubuntu-latest
    environment: infra
    timeout-minutes: 25
    steps:
      - name: Check gate
        if: vars.INFRA_CONFIGURED != 'true'
        run: |
          echo "::error::INFRA_CONFIGURED is not true; refusing to call Coolify"
          exit 1

      - name: Find or create the application
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          PROJECT_UUID: ${{ vars.COOLIFY_PROJECT_UUID }}
          SERVER_UUID: ${{ vars.COOLIFY_SERVER_UUID }}
          ENVIRONMENT: ${{ vars.COOLIFY_ENVIRONMENT_NAME }}
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          auth=(-H "Authorization: Bearer $COOLIFY_API_TOKEN" -H "Accept: application/json")

          apps="$(curl -fsS --max-time 30 "${auth[@]}" "$base/applications")"
          uuid="$(jq -r '.[]? | select(.name == "litellm") | .uuid' <<<"$apps" | head -1)"

          if [ -z "$uuid" ]; then
            body="$(jq -n \
              --arg project "$PROJECT_UUID" \
              --arg server "$SERVER_UUID" \
              --arg env "$ENVIRONMENT" \
              '{
                project_uuid: $project,
                server_uuid: $server,
                environment_name: $env,
                git_repository: "https://github.com/WCKDai/platform",
                git_branch: "main",
                build_pack: "dockercompose",
                docker_compose_location: "/services/litellm/docker-compose.yaml",
                name: "litellm",
                description: "LiteLLM gateway for PolyCore agents",
                ports_exposes: "4000",
                instant_deploy: false
              }')"
            response="$(curl -sS -w '\n%{http_code}' --max-time 60 -X POST \
              "${auth[@]}" -H "Content-Type: application/json" -d "$body" "$base/applications/public")"
            code="$(tail -n 1 <<<"$response")"
            payload="$(sed '$d' <<<"$response")"
            if [ "$code" != "201" ]; then
              echo "::error::creating the application returned HTTP $code: $payload"
              exit 1
            fi
            uuid="$(jq -r '.uuid' <<<"$payload")"
            echo "created application $uuid"
          else
            echo "reusing application $uuid"
          fi
          echo "APP_UUID=$uuid" >>"$GITHUB_ENV"

      - name: Set the public domain
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          set -euo pipefail
          body='{"docker_compose_domains":[{"name":"litellm","domain":"https://llm.polykrom.app"}]}'
          response="$(curl -sS -w '\n%{http_code}' --max-time 30 -X PATCH \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            -H "Content-Type: application/json" -d "$body" \
            "${COOLIFY_URL%/}/api/v1/applications/$APP_UUID")"
          code="$(tail -n 1 <<<"$response")"
          echo "domain: HTTP $code $(sed '$d' <<<"$response" | head -c 400)"
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then exit 1; fi

      - name: Write the application environment
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
          LITELLM_SALT_KEY: ${{ secrets.LITELLM_SALT_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.LITELLM_POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.LITELLM_REDIS_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LITELLM_DOMAIN: https://llm.polykrom.app
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          providers=0
          for name in LITELLM_MASTER_KEY LITELLM_SALT_KEY POSTGRES_PASSWORD REDIS_PASSWORD \
                      ANTHROPIC_API_KEY OPENAI_API_KEY GEMINI_API_KEY DEEPSEEK_API_KEY LITELLM_DOMAIN; do
            value="${!name}"
            if [ -z "$value" ]; then
              case "$name" in
                *API_KEY) echo "::warning::$name is not set in the infra environment" ;;
                *) echo "::error::$name is required"; exit 1 ;;
              esac
            fi
            case "$name" in *API_KEY) [ -n "$value" ] && providers=$((providers + 1)) ;; esac
            body="$(jq -n --arg k "$name" --arg v "$value" '{data:[{key:$k,value:$v}]}')"
            code="$(curl -sS -o /tmp/out -w '%{http_code}' --max-time 30 -X PATCH \
              -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
              -H "Content-Type: application/json" -d "$body" \
              "$base/applications/$APP_UUID/envs/bulk" || true)"
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::setting $name returned HTTP $code: $(cat /tmp/out)"
              exit 1
            fi
            echo "set $name"
          done
          if [ "$providers" -eq 0 ]; then
            echo "::error::no provider key set; the gateway would start with no models"
            exit 1
          fi

      - name: Show the application
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            -H "Accept: application/json" \
            "${COOLIFY_URL%/}/api/v1/applications/$APP_UUID" \
            | jq '{uuid, name, status, fqdn, docker_compose_location, docker_compose_domains}'

      - name: Trigger the deployment
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          set -euo pipefail
          response="$(curl -sS -w '\n%{http_code}' --max-time 60 -X POST \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            -H "Accept: application/json" \
            "${COOLIFY_URL%/}/api/v1/deploy?uuid=$APP_UUID")"
          code="$(tail -n 1 <<<"$response")"
          echo "deploy: HTTP $code $(sed '$d' <<<"$response")"
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then exit 1; fi

      - name: Wait for a running application
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            status="$(curl -fsS --max-time 30 \
              -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
              -H "Accept: application/json" \
              "${COOLIFY_URL%/}/api/v1/applications/$APP_UUID" | jq -r '.status // "unknown"')"
            echo "attempt $i: $status"
            # The previous deployment's status survives until the new containers replace it,
            # so only a healthy running application ends the wait; the timeout is the failure.
            [ "$status" = "running:healthy" ] && exit 0
            sleep 10
          done
          echo "::error::timed out waiting for the application"
          exit 1
