organization: WCKDai

projects:
  polycore:
    repository: WCKDai/polycore
    visibility: public
    cache_prefix: polycore
    runner_labels: [self-hosted, linux, x64, rust-16, trusted]
    task_schema: agent/task.schema.json
    default_branch: main
  polykrom:
    repository: WCKDai/polykrom
    visibility: public
    cache_prefix: polykrom
    runner_labels: [self-hosted, linux, x64, rust-16, trusted]
    default_branch: main

models:
  aliases:
    cheap: deepseek/deepseek-flash
    standard: claude-sonnet-5-5
    strong: claude-opus-5-5
    review: gpt-6.1-sol
    long_context: gemini-4-argon
  escalation_order: [cheap, standard, strong]
  review_provider_family: openai
  budgets:
    monthly_usd: 100
    default_task_usd: 2
    complex_task_usd: 10
    phase_gate_task_usd: 50
    max_attempts: 6

worker:
  provider: netcup
  provisioning: existing-coolify-server
  os: debian-13
  arch: x64
  minimum:
    cpu_cores: 16
    memory_gb: 64
    disk_gb: 360
  actual_variables:
    cpu_cores: WORKER_CPU_CORES
    memory_gb: WORKER_MEMORY_GB
    disk_gb: WORKER_DISK_GB
  tailscale:
    tailnet_variable: TAILSCALE_TAILNET
    worker_client_id_variable: TAILSCALE_WORKER_CLIENT_ID
    worker_client_secret: TAILSCALE_WORKER_CLIENT_SECRET
    worker_hostname_variable: TAILSCALE_WORKER_HOSTNAME
    worker_tags: [tag:polycore-gateway]
    worker_scopes: [auth_keys, devices:core]
    ci_client_id_variable: TAILSCALE_CI_CLIENT_ID
    ci_client_secret: TAILSCALE_CI_CLIENT_SECRET
    ci_tags: [tag:polycore-ci]
    ci_scopes: [auth_keys]
  concurrency:
    # Starting point for a 16 vCPU / 64 GB host; raise only after measuring
    # load, cache-hit rate and queue time.
    agent_writers: 2
    verifiers: 1
    concurrent_ci_jobs: 1

cache:
  provider: cloudflare-r2
  bucket_variable: R2_BUCKET
  endpoint_variable: R2_ENDPOINT
  region: auto
  ssl: true
  prefixes:
    polycore: polycore
    polykrom: polykrom

coolify:
  environment: production
  services:
    - postgres
    - redis
    - litellm
    - temporal
    - langfuse
  private_access: tailscale
  public_endpoints:
    coolify_ui: true
    litellm: false
    temporal: false
    langfuse: owner-only

ci:
  pull_requests: github-hosted-linux
  merge_and_main: trusted-self-hosted-linux
  macos: existing-apple-silicon
  gpu: nightly-only
  required_runner_label: rust-16
  shared_workflow: .github/workflows/alpha-r2.yml
  repository_access: selected-current-repositories
  future_repositories: explicit-approval-required
  cache_prefix_default: repository-name
  private_cache_credentials: repository-secrets-on-github-free

# Keys the workflows read directly. Declared here so the audit can tell an unused secret from
# one that only exists at runtime; the names live in GitHub environments, never the values.
runtime_keys:
  - COOLIFY_API_TOKEN
  - COOLIFY_SERVER_UUID
  - COOLIFY_URL
  - INFRA_CONFIGURED
  - NETWORK_CONFIGURED
  - R2_ACCESS_KEY_ID
  - R2_CONFIGURED
  - R2_SECRET_ACCESS_KEY
  - SCCACHE_REGION
  - SCCACHE_S3_USE_SSL
  - TAILSCALE_CI_TAGS
