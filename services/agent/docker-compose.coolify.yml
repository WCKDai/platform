# Coolify deployment: Invincible (cloud models through LiteLLM), Autobot and the panel.
# Coolify's Traefik terminates TLS; there is no Caddy here. The panel service is the public one.
#
# Coolify magic variables (generated, visible in the application's Environment tab):
#   SERVICE_PASSWORD_64_INVINCIBLE  gateway token, also written to the shared volume
#   SERVICE_PASSWORD_64_PANEL       panel login password
#   SERVICE_PASSWORD_64_SECRET      session signing secret
#
# Set CLOUD_BASE_URL, CLOUD_MODEL and CLOUD_API_KEY in the Coolify application.
name: wckd-agent-coolify

services:
  gateway:
    build:
      context: ./images/gateway
    restart: unless-stopped
    environment:
      INVINCIBLE_HOME: /data
      INVINCIBLE_TOKEN: ${SERVICE_PASSWORD_64_INVINCIBLE:?generated by Coolify}
      CLOUD_BASE_URL: ${CLOUD_BASE_URL:?set in Coolify}
      CLOUD_MODEL: ${CLOUD_MODEL:?set in Coolify}
      CLOUD_API_KEY: ${CLOUD_API_KEY:?set in Coolify}
      CLOUD_CONTEXT: ${CLOUD_CONTEXT:-65536}
    volumes:
      - gateway-data:/data
    expose:
      - "7777"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7777/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  agent:
    build:
      context: ./images/autobot
      dockerfile: Dockerfile.coolify
    restart: unless-stopped
    environment:
      AUTOBOT_HOME: /data
      INVINCIBLE_HOME: /invincible
      GATEWAY_URL: http://gateway:7777/v1
      GATEWAY_MODEL: ${CLOUD_MODEL:?set in Coolify}
      GATEWAY_PRIVATE: "false"
      APPROVALS_MODE: auto
      AGENT_WORKDIR: /workspace
    volumes:
      - agent-data:/data
      - gateway-data:/invincible:ro
      - workspace:/workspace
    depends_on:
      gateway:
        condition: service_healthy
    expose:
      - "7792"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7792/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  panel:
    build:
      context: ./panel
    restart: unless-stopped
    environment:
      PORT: "7800"
      PANEL_BIND: 0.0.0.0
      GATEWAY_URL: http://gateway:7777/v1
      AGENT_URL: http://agent:7792
      INVINCIBLE_TOKEN_FILE: /invincible/token
      PANEL_PASSWORD: ${SERVICE_PASSWORD_64_PANEL:?generated by Coolify}
      PANEL_SECRET: ${SERVICE_PASSWORD_64_SECRET:?generated by Coolify}
      PANEL_SECURE_COOKIES: "true"
    volumes:
      - gateway-data:/invincible:ro
    depends_on:
      agent:
        condition: service_healthy
    expose:
      - "7800"

volumes:
  gateway-data:
  agent-data:
  workspace:
