name: Preflight

# Manual credential and connectivity checks. Nothing here provisions or deploys.
# Each job is gated by its environment flag so an unconfigured control plane
# fails closed instead of silently skipping.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preflight
  cancel-in-progress: false

jobs:
  cache:
    name: R2 sccache credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check gate
        if: vars.R2_CONFIGURED != 'true'
        env:
          OBSERVED: ${{ vars.R2_CONFIGURED }}
        run: |
          echo "observed R2_CONFIGURED='$OBSERVED'"
          echo "::error::R2_CONFIGURED is not true; refusing to touch the cache bucket"
          exit 1

      - name: Read, write and delete one probe object
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.SCCACHE_REGION }}
          AWS_EC2_METADATA_DISABLED: "true"
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          key="_preflight/$(date -u +%Y%m%dT%H%M%SZ).txt"
          printf 'preflight\n' > probe.txt
          aws s3api put-object --bucket "$R2_BUCKET" --key "$key" \
            --body probe.txt --endpoint-url "$R2_ENDPOINT" >/dev/null
          aws s3api head-object --bucket "$R2_BUCKET" --key "$key" \
            --endpoint-url "$R2_ENDPOINT" >/dev/null
          aws s3api delete-object --bucket "$R2_BUCKET" --key "$key" \
            --endpoint-url "$R2_ENDPOINT" >/dev/null
          echo "R2 read/write/delete OK in $R2_BUCKET"

      - name: Start sccache against R2
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Verify the sccache client can open the store
        env:
          SCCACHE_BUCKET: ${{ vars.R2_BUCKET }}
          SCCACHE_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          SCCACHE_REGION: ${{ vars.SCCACHE_REGION }}
          SCCACHE_S3_USE_SSL: ${{ vars.SCCACHE_S3_USE_SSL }}
          SCCACHE_S3_KEY_PREFIX: _preflight
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          sccache --start-server
          sccache --show-stats
          sccache --stop-server

  network:
    name: Tailscale CI client
    runs-on: ubuntu-latest
    environment: network
    timeout-minutes: 10
    steps:
      - name: Check gate
        if: vars.NETWORK_CONFIGURED != 'true'
        env:
          OBSERVED: ${{ vars.NETWORK_CONFIGURED }}
        run: |
          echo "observed NETWORK_CONFIGURED='$OBSERVED'"
          echo "::error::NETWORK_CONFIGURED is not true; refusing to join the tailnet"
          exit 1

      - name: Check OAuth client scopes
        env:
          CI_ID: ${{ vars.TAILSCALE_CI_CLIENT_ID }}
          CI_SECRET: ${{ secrets.TAILSCALE_CI_CLIENT_SECRET }}
          WORKER_ID: ${{ vars.TAILSCALE_WORKER_CLIENT_ID }}
          WORKER_SECRET: ${{ secrets.TAILSCALE_WORKER_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          probe() {
            local name="$1" id="$2" secret="$3" response code body scope
            response="$(curl -sS -w '\n%{http_code}' \
              -u "$id:$secret" \
              -d grant_type=client_credentials \
              https://api.tailscale.com/api/v2/oauth/token)"
            code="$(tail -n 1 <<<"$response")"
            body="$(sed '$d' <<<"$response")"
            if [ "$code" != "200" ]; then
              echo "::error::$name client rejected (HTTP $code): $body"
              return 1
            fi
            scope="$(jq -r '.scope // ""' <<<"$body")"
            echo "$name client scope: $scope"
            PROBED_SCOPE="$scope"
          }

          PROBED_SCOPE=""
          probe CI "$CI_ID" "$CI_SECRET"
          ci_scope="$PROBED_SCOPE"

          PROBED_SCOPE=""
          probe WORKER "$WORKER_ID" "$WORKER_SECRET"
          worker_scope="$PROBED_SCOPE"

          # Scopes are space separated; normalise before matching.
          ci_csv=",${ci_scope// /,},"
          worker_csv=",${worker_scope// /,},"

          case "$ci_csv" in
            *",auth_keys,"*) ;;
            *)
              echo "::error::CI client has [$ci_scope] but needs auth_keys to mint node keys"
              exit 1
              ;;
          esac
          case "$ci_csv" in
            *",devices:core,"*)
              echo "::warning::CI client should not hold devices:core; remove it"
              ;;
          esac
          case "$worker_csv" in
            *",auth_keys,"*) ;;
            *) echo "::warning::worker client has [$worker_scope]; it also needs auth_keys" ;;
          esac

      - name: Join the tailnet with the CI OAuth client
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ vars.TAILSCALE_CI_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_CI_CLIENT_SECRET }}
          tags: ${{ vars.TAILSCALE_CI_TAGS }}
          hostname: polycore-preflight
          timeout: 2m

      - name: Verify identity, tailnet and tag
        env:
          TAILSCALE_TAILNET: ${{ vars.TAILSCALE_TAILNET }}
          EXPECTED_TAG: ${{ vars.TAILSCALE_CI_TAGS }}
        run: |
          set -euo pipefail
          status="$(sudo tailscale status --json)"
          jq -e '.BackendState == "Running"' <<<"$status" >/dev/null
          self="$(jq -r '.Self.DNSName' <<<"$status")"
          tags="$(jq -r '(.Self.Tags // []) | join(",")' <<<"$status")"
          echo "self: $self"
          echo "tags: $tags"
          case "$self" in
            *"$TAILSCALE_TAILNET"*) ;;
            *) echo "::error::node is not in $TAILSCALE_TAILNET"; exit 1 ;;
          esac
          case ",$tags," in
            *",$EXPECTED_TAG,"*) ;;
            *) echo "::error::node is missing $EXPECTED_TAG"; exit 1 ;;
          esac

      - name: Log out
        if: always()
        run: sudo tailscale logout || true

  gateway:
    name: Agent gateway
    runs-on: ubuntu-latest
    environment: infra
    timeout-minutes: 10
    steps:
      - name: Check gate
        if: vars.INFRA_CONFIGURED != 'true'
        env:
          OBSERVED: ${{ vars.INFRA_CONFIGURED }}
        run: |
          echo "observed INFRA_CONFIGURED='$OBSERVED'"
          echo "::error::INFRA_CONFIGURED is not true; refusing to probe the gateway"
          exit 1

      - name: Probe LiteLLM
        env:
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
          GATEWAY: https://llm.polykrom.app
        run: |
          set -euo pipefail
          [ -n "${LITELLM_MASTER_KEY:-}" ] || { echo "::error::LITELLM_MASTER_KEY is not set"; exit 1; }
          echo "liveliness: $(curl -fsS --max-time 20 "$GATEWAY/health/liveliness")"
          code="$(curl -sS -o /tmp/models -w '%{http_code}' --max-time 20 "$GATEWAY/v1/models")"
          [ "$code" = "401" ] || { echo "::error::an unauthenticated /v1/models returned $code, expected 401"; exit 1; }
          echo "unauthenticated /v1/models: 401"
          models="$(curl -fsS --max-time 20 -H "Authorization: Bearer $LITELLM_MASTER_KEY" "$GATEWAY/v1/models" | jq -r '.data[].id')"
          echo "models:"
          while IFS= read -r model; do echo "  $model"; done <<<"$models"
          [ -n "$models" ] || { echo "::error::the gateway returned no models"; exit 1; }

  infra:
    name: Coolify control plane
    runs-on: ubuntu-latest
    environment: infra
    timeout-minutes: 10
    steps:
      - name: Check gate
        if: vars.INFRA_CONFIGURED != 'true'
        env:
          OBSERVED: ${{ vars.INFRA_CONFIGURED }}
        run: |
          echo "observed INFRA_CONFIGURED='$OBSERVED'"
          echo "::error::INFRA_CONFIGURED is not true; refusing to call Coolify"
          exit 1

      - name: Verify the API token and server UUID
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_SERVER_UUID: ${{ vars.COOLIFY_SERVER_UUID }}
        run: |
          set -euo pipefail
          COOLIFY_URL="${COOLIFY_URL%/}"
          call() {
            local path="$1" response code body
            response="$(curl -sS -w '\n%{http_code}' --max-time 20 \
              -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
              -H "Accept: application/json" \
              "$COOLIFY_URL$path")"
            code="$(tail -n 1 <<<"$response")"
            body="$(sed '$d' <<<"$response")"
            if [ "$code" != "200" ]; then
              echo "::error::$path returned HTTP $code: $body"
              return 1
            fi
            printf '%s' "$body"
          }

          echo "version: $(call /api/v1/version)"
          servers="$(call /api/v1/servers)"
          jq -e --arg uuid "$COOLIFY_SERVER_UUID" 'any(.[]?; .uuid == $uuid)' \
            <<<"$servers" >/dev/null
          echo "Coolify server $COOLIFY_SERVER_UUID is reachable"
