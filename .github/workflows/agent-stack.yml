name: Agent stack

# Optional private GHCR images for maintainers. The alpha does not use these packages: it loads
# the public, signed release tarballs from agent-images.yml with pull_policy: never.

# Test the panel and both compose files on every change; publish the gateway, agent and panel
# images on main. Deployment is the separate deploy-agent-coolify workflow (the alpha path); the
# host-networking alternative is scripts/deploy-alpha.sh.

on:
  push:
    branches: [main]
    paths:
      - "services/agent/**"
      - ".github/workflows/agent-stack.yml"
  pull_request:
    paths:
      - "services/agent/**"
      - ".github/workflows/agent-stack.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-stack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Panel and compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Syntax check
        working-directory: services/agent/panel
        run: |
          node --check server.mjs
          node --check public/app.js
      - name: Validate compose
        working-directory: services/agent
        run: |
          cp .env.example .env
          docker compose config >/dev/null
          rm .env
          SERVICE_PASSWORD_64_INVINCIBLE=test SERVICE_PASSWORD_64_PANEL=test SERVICE_PASSWORD_64_SECRET=test \
            CLOUD_BASE_URL=https://llm.example/v1 CLOUD_MODEL=test CLOUD_API_KEY=test \
            docker compose -f docker-compose.coolify.yml config >/dev/null
      - name: Check the password hasher
        working-directory: services/agent/panel
        run: |
          hash="$(node scripts/hash-password.mjs 'test password')"
          case "$hash" in scrypt:*) ;; *) echo "bad hash: $hash"; exit 1 ;; esac

  build:
    name: Publish images
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Build the agent, panel and gateway images
        working-directory: services/agent
        env:
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          scripts/fetch-linux-binaries.sh v0.0.27 x86_64
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker build -t "ghcr.io/$owner/wckd-autobot:${{ github.sha }}" -t "ghcr.io/$owner/wckd-autobot:latest" images/autobot
          docker build -t "ghcr.io/$owner/wckd-agent-panel:${{ github.sha }}" -t "ghcr.io/$owner/wckd-agent-panel:latest" panel
          docker build -t "ghcr.io/$owner/wckd-invincible-gateway:${{ github.sha }}" -t "ghcr.io/$owner/wckd-invincible-gateway:latest" images/gateway
          for image in wckd-autobot wckd-agent-panel wckd-invincible-gateway; do
            docker push "ghcr.io/$owner/$image:${{ github.sha }}"
            docker push "ghcr.io/$owner/$image:latest"
          done

