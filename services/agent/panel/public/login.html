<!doctype html>
<html lang="en" class="wa-dark wa-brand-purple">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Sign in · Invincible control</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23121211'/%3E%3Crect x='3' y='3' width='4' height='10' fill='%239373ff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/vendor/webawesome/styles/themes/default.css">
  <link rel="stylesheet" href="/app.css?v={{ASSET_VERSION}}">
  <script type="module" src="/vendor/panel-kit.js"></script>
</head>
<body class="login-body">
  <main class="login">
    <a class="brand" href="/" aria-label="Invincible control">
      <span class="mark" aria-hidden="true"></span>
      <span class="brand-text"><strong>Invincible</strong><span>Control</span></span>
    </a>
    <p class="kicker">WCKD</p>
    <h1>Sign in</h1>
    <p class="lede">One password for this node. No account and no third party.</p>
    <form method="post" action="/login" class="login-form">
      <wa-input id="password" name="password" type="password" password-toggle label="Operator password" autocomplete="current-password" autofocus required size="s"></wa-input>
      <p class="error" role="alert">{{ERROR}}</p>
      <wa-button class="primary" variant="brand" type="submit" size="s">Enter</wa-button>
    </form>
    <p class="muted small">Model keys stay in the gateway. Sessions stay in Autobot.</p>
  </main>
</body>
</html>
