# LiteLLM gateway for PolyCore/Polykrom agents.
#
# Every value comes from the Coolify application's environment; nothing secret is in this file.
# The model list is embedded with Compose `configs.content` because Coolify copies only this
# file to the deployment directory, so a sibling config.yaml bind mount would not exist.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in Coolify}
      POSTGRES_DB: litellm
    volumes:
      - litellm-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in Coolify}", "--appendonly", "yes"]
    volumes:
      - litellm-redis:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in Coolify}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "2"]
    # Coolify derives the proxy's backend port from an exposed port; without it Traefik
    # creates the router but no service and answers 503.
    expose:
      - "4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set in Coolify}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?set in Coolify}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@postgres:5432/litellm
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    configs:
      - source: litellm_config
        target: /app/config.yaml
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

configs:
  litellm_config:
    content: |
      # Logical model aliases. Verify provider model identifiers at deployment time.
      model_list:
        - model_name: cheap
          litellm_params:
            model: deepseek/deepseek-flash
            api_key: os.environ/DEEPSEEK_API_KEY
        - model_name: standard
          litellm_params:
            model: anthropic/claude-sonnet-5-5
            api_key: os.environ/ANTHROPIC_API_KEY
        - model_name: strong
          litellm_params:
            model: anthropic/claude-opus-5-5
            api_key: os.environ/ANTHROPIC_API_KEY
        - model_name: review
          litellm_params:
            model: openai/gpt-6.1-sol
            api_key: os.environ/OPENAI_API_KEY
        - model_name: long_context
          litellm_params:
            model: gemini/gemini-4-argon
            api_key: os.environ/GEMINI_API_KEY

      router_settings:
        fallbacks:
          - cheap: [standard]
          - standard: [strong]
          - strong: [review]
        allowed_fails: 2
        cooldown_time: 30

      litellm_settings:
        drop_params: true
        request_timeout: 600
        num_retries: 2

      general_settings:
        master_key: os.environ/LITELLM_MASTER_KEY
        database_url: os.environ/DATABASE_URL

volumes:
  litellm-postgres:
  litellm-redis:
