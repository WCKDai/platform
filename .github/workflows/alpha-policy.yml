name: Alpha workflow policy

on:
  pull_request:
    paths: ['.github/workflows/alpha-*.yml', 'tests/test_alpha_r2.py']
  push:
    branches: [main]
    paths: ['.github/workflows/alpha-*.yml', 'tests/test_alpha_r2.py']

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_alpha_r2.py' -v
