name: Probe agent deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe
    runs-on: ubuntu-latest
    environment: infra
    steps:
      - name: Probe
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          set -uo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          auth=(-H "Authorization: Bearer $COOLIFY_API_TOKEN" -H "Accept: application/json")
          apps="$(curl -fsS --max-time 30 "${auth[@]}" "$base/applications")"
          uuid="$(jq -r '.[]? | select(.name == "agent-panel") | .uuid' <<<"$apps" | head -1)"
          echo "app=$uuid"
          echo "## app"
          curl -sS --max-time 30 "${auth[@]}" "$base/applications/$uuid" \
            | jq '{status, fqdn, docker_compose_domains, ports_exposes, build_pack, updated_at}'
          deps="$(curl -sS --max-time 30 "${auth[@]}" "$base/deployments/applications/$uuid?take=5" || echo '[]')"
          echo "## shape"
          jq -c 'if type == "array" then {type: "array", length: length, kinds: (map(type) | unique)} elif type == "object" then {type: "object", keys: keys} else {type: type, value: .} end' <<<"$deps"
          echo "## first records"
          jq -c 'if type == "array" then .[0:5] | map(if type == "object" then {id, deployment_uuid, status, created_at, application_id, application_name} else . end) else . end' <<<"$deps" | head -c 4000
          echo
          dep_uuid="$(jq -r 'if type == "array" then . elif type == "object" and (.deployments | type) == "array" then .deployments else [] end | map(select(type == "object" and .deployment_uuid != null)) | sort_by(.created_at // "") | last | .deployment_uuid // empty' <<<"$deps")"
          echo "## deployment=$dep_uuid"
          echo "## logs from the list"
          jq -r '(.deployments // .) | map(select(type == "object" and .deployment_uuid != null)) | sort_by(.created_at // "") | last | .logs // empty' <<<"$deps" \
            | sed -E 's/[A-Za-z0-9_\/+=-]{40,}/***/g' | tail -150
          echo "## logs from the record"
          if [ -n "$dep_uuid" ]; then
            curl -sS -w '\nHTTP %{http_code}\n' --max-time 30 "${auth[@]}" "$base/deployments/$dep_uuid" \
              | sed -E 's/[A-Za-z0-9_\/+=-]{40,}/***/g' | tail -40
          fi
