name: Alpha R2 credentials

# Copies the org's R2 compile-cache key onto alpha, into the runner user's ~/.aws/credentials
# (mode 600), where sccache finds it through the standard AWS credential chain. Builds of main on
# alpha then reach the R2 cache without the key being shared with any repository: a repository's
# pull request runs its own copy of its workflows and could read any secret the repository has.
#
# Run it by hand from main after sharing R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY with this
# repository, then stop sharing them (docs/runners.md, "R2 key on alpha"). Run it again after a
# key rotation.
on:
  workflow_dispatch:

permissions: {}

jobs:
  install:
    if: github.repository_owner == 'WCKDai' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on:
      group: trusted
      labels: [self-hosted, linux, x64, rust-16, trusted]
    timeout-minutes: 5
    steps:
      - name: Write the key for the runner user
        env:
          ACTUAL_RUNNER: ${{ runner.name }}
          KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          KEY_SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$ACTUAL_RUNNER" = alpha ] || { echo '::error::Expected alpha'; exit 1; }
          if [ -z "$KEY_ID" ] || [ -z "$KEY_SECRET" ]; then
            echo '::error::R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY are not shared with this repository'
            exit 2
          fi
          umask 077
          mkdir -p "$HOME/.aws"
          tmp="$(mktemp "$HOME/.aws/credentials.XXXXXX")"
          printf '[default]\naws_access_key_id = %s\naws_secret_access_key = %s\n' "$KEY_ID" "$KEY_SECRET" > "$tmp"
          mv -f "$tmp" "$HOME/.aws/credentials"
          echo "written: $(stat -c '%a %U' "$HOME/.aws/credentials") $HOME/.aws/credentials"
